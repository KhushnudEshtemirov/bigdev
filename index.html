<!doctype html>
<html lang="en">
  <head>

    <meta
      property="og:title"
      content="Khushnud Eshtemirov — Frontend Developer"
    />

    <meta property="og:locale" content="en_US" />

      name="twitter:title"
      content="Khushnud Eshtemirov — Frontend Developer"
    />

      name="twitter:description"
      content="Frontend developer building admin panels, dashboards, and banking interfaces with React, TypeScript, and Tailwind CSS."

    <meta name="theme-color" content="#12141C" />

        "knowsAbout": [
          "React",
